<script>
const API_BASE_URL = 'https://mt5-api-backend.i96463073.workers.dev';
const ACCOUNT_ID = 'isaac_01'; 
const API_KEY = 'IsaacSecret2026'; 

const A = [
    { id: '581022950', n: 'Isaac', t: 'BOOSTER', c: '', b: 0.00 },
    { id: '501148369', n: 'My Real Account', t: 'STANDARD', c: 'g', b: 0.52 }
];
const RATE = 132.11; 
const fm = n => Number(n).toFixed(2);
let totalFunds = 0.52; 
let globalTx = [];
let openPositions = [];

const S = { v: 'home', prev: 'home', tab: 0, step: 1, meth: 'Mobile Money', amt: '', wamt: '', from: null, to: 1, tamt: '', st: 1, ai: 1 };

const $ = s => document.querySelector(s);
const ic = (n, x = '') => `<span class="ms ${x}">${n}</span>`;

function toast(m) {
    const t = $('#toast');
    t.textContent = m; t.classList.add('o');
    setTimeout(() => t.classList.remove('o'), 2200);
}

/* ===== STK Modal Logic ===== */
let stkCallback = null;
function openStk(amountKES, cb) {
    stkCallback = cb;
    const text = `Do you want to pay Kshs. ${Number(amountKES).toLocaleString()} to JAMBOPAY 4 Account no. LJDBXUTQJK?`;
    $('#stk-text').textContent = text;
    $('#stk-input').value = '';
    $('#stk-modal').classList.add('on');
    setTimeout(() => $('#stk-input').focus(), 150);
}
function closeStk() {
    $('#stk-modal').classList.remove('on');
    stkCallback = null;
}
function submitStk() {
    const pin = $('#stk-input').value;
    if (pin === '4020') {
        $('#stk-modal').classList.remove('on');
        if (stkCallback) stkCallback();
    } else {
        toast('Incorrect M-PESA PIN. Hint: 4020');
        $('#stk-input').value = '';
        $('#stk-input').focus();
    }
}

function go(v) {
    if (v == 'accounts' && S.v != 'accounts' && !S.keep) S.ai = 1;
    S.keep = 0; S.prev = S.v; S.v = v; S.tab = 0;
    if (v == 'deposit') S.step = 1;
    if (v == 'withdraw') S.wamt = '';
    render(); window.scrollTo(0, 0);
}
const back = () => go(S.prev && S.prev != 'profile' ? S.prev : 'home');
function sheet(h) { $('#sh').innerHTML = '<div class="hl"></div>' + h; $('#ov').classList.add('o'); }

async function syncData() {
    try {
        const response = await fetch(`${API_BASE_URL}/api/sync?account=${ACCOUNT_ID}`);
        if(response.ok) {
            const data = await response.json();
            const newBalance = Number(data.balance);
            if (!isNaN(newBalance)) {
                A[0].b = newBalance;
                totalFunds = A[0].b + A[1].b;
            }
            if (data.transactions && data.transactions.length > 0) {
                globalTx = data.transactions.map(tx => {
                    const date = new Date(tx.created_at || Date.now());
                    const dateStr = date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
                    const timeStr = date.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                    return { d: dateStr, a: tx.amount, id: tx.id.substring(0, 8).toUpperCase(), s: tx.status === 'COMPLETED' ? 'ok' : 'p', t: timeStr, ty: tx.type.includes('DEPOSIT') ? 'D' : 'W' };
                });
            }
            if (S.v === 'home' || S.v === 'funds' || S.v === 'accounts' || S.v === 'withdraw') render();
        }
    } catch(e) { console.error("[Sync] Network error:", e); }
}

async function sendDepositToMT5(amountUSD) {
    try {
        toast('Contacting Server...');
        const response = await fetch(`${API_BASE_URL}/api/deposit`, {

async function sendWithdrawToMT5(amountUSD) {
    try {
        toast('Processing withdrawal...');
        const response = await fetch(`${API_BASE_URL}/api/withdraw`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accountId: ACCOUNT_ID, amount: amountUSD, currency: 'USD' })
        });
        if (response.ok) {
            const data = await response.json();
            if(data.success) {
                A[0].b = Math.max(0, A[0].b - amountUSD);
                totalFunds = A[0].b + A[1].b;
                toast('Withdrawal successful!');
                setTimeout(syncData, 800);
                go('home');
            } else {
                toast('Failed: ' + (data.error || 'Insufficient funds'));
            }
        } else { toast('Withdrawal failed. Server error.'); }
    } catch (e) { toast('Network error during withdrawal'); }
}

function spark(seed, k, neg) {
    let s = seed, r = () => (s = (s * 9301 + 49297) % 233280) / 233280, p = [], v = 40;
    for (let i = 0; i < 30; i++) {
        if (k == 'crash') v += i > 28 ? -70 : r() * 0.6;
        else if (k == 'drop') v += i < 4 ? -16 : (i == 12 ? -4 : r() * 0.2);
        else if (k == 'step') v += r() > 0.8 ? r() * 14 : r() * 0.8;
        else if (k == 'spk') v += (r() > 0.93 ? r() * 40 : r() * 0.6) * (r() > 0.7 ? -0.5 : 1);
        else v += r() * 2.4;
        p.push([i * 3.6, v]);
    }
    const mx = Math.max(...p.map(a => a[1])), mn = Math.min(...p.map(a => a[1])), y = a => 50 - (a - mn) / (mx - mn || 1) * 44;
    const pts = p.map(a => a[0].toFixed(1) + ',' + y(a[1]).toFixed(1)).join(' ');
    return `<svg class="sp" viewBox="0 0 108 52" preserveAspectRatio="none"><polygon points="0,52 ${pts} 108,52" fill="${neg ? '#e5484d' : '#21a56f'}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${neg ? '#e5484d' : '#21a56f'}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

}

function onStkSuccess() {
    const usdAmount = (+S.amt || 0) / RATE;

    }
    S.amt = '';

function openTradePrompt() {
    const amt = prompt("Enter trade size in USD (Balance will only change when you close the trade):");
    if (!amt || isNaN(amt) || amt <= 0) return;
    if (+amt > totalFunds) return toast('Insufficient balance to open this trade.');
    
    const type = Math.random() > 0.5 ? 'BUY' : 'SELL';
    const id = Date.now().toString().slice(-4);
    openPositions.push({ id, amount: +amt, pair: 'EUR/USD', type });
    toast('Trade Opened! Balance locked until closed.');
    render();
}

function closeTrade(id) {
    const idx = openPositions.findIndex(p => p.id == id);
    if (idx === -1) return;
    const pos = openPositions[idx];
    
    const win = Math.random() > 0.5;
    const pnl = win ? (pos.amount * 0.5) : -(pos.amount * 0.2);
    
    A[1].b = Math.max(0, A[1].b + pnl);
    totalFunds = A[0].b + A[1].b;
    
    openPositions.splice(idx, 1);
    
    toast(`Trade Closed! PnL: ${pnl > 0 ? '+' : ''}${fm(pnl)} USD`);
    render();
}

function pk(w, i) {
    if (i < 0) return toast('Wallet has no funds');
    if (w == 'from' && i == S.to || w == 'to' && i == S.from) return toast('Choose different accounts');
    if (w == 'from') S.from = i; else S.to = i;
    cs(); render();
}

function doT() {
    const f = A[S.from];
    if (!f || !(+S.tamt > 0)) return;
    if (+S.tamt > f.b) return toast('Not enough funds');
    f.b -= +S.tamt;
    A[S.to].b += +S.tamt;
    totalFunds = A[0].b + A[1].b;
    S.tamt = ''; S.from = null;
    toast('Transfer complete');
    go('home');
}

    const show = NV[v] || ['profile','notifications'].includes(v);
    $('#nav').style.display = show ? 'flex' : 'none';
    
    $('#nav').innerHTML = Object.entries(NV).map(([k, n]) => `
        <button class="${v == k || (!NV[v] && k == 'home') ? 'on' : ''}" onclick="go('${k}')">
            ${k == 'home' ? '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 5l6.5 14L12 13.5M21 5l-6.5 14L12 13.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ic(n[0])}
            ${n[1]}
        </button>
    `).join('');

    setTimeout(setupAutoScroll, 100);
}

let bannerTimer;
function setupAutoScroll() {
    clearInterval(bannerTimer);
    const car = document.getElementById('bannerCar');
    if (!car) return;
    let paused = false;
    ['touchstart', 'mousedown'].forEach(e => car.addEventListener(e, () => paused = true, {passive: true}));
    ['touchend', 'mouseup'].forEach(e => car.addEventListener(e, () => paused = false, {passive: true}));
    bannerTimer = setInterval(() => {
        if (paused || !car.isConnected) return;
        const step = car.firstElementChild.offsetWidth + 12;
        car.scrollLeft >= car.scrollWidth - car.clientWidth - 10
            ? car.scrollTo({left: 0, behavior: 'smooth'})
            : car.scrollTo({left: car.scrollLeft + step, behavior: 'smooth'});
    }, 3500); 
}

render();
syncData();
</script>
</body>
</html>
