/* ===== STK / M-PESA PIN PROMPT ===== */
#stk-modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.15s}

.stk-card p{font-size:16px;line-height:1.3;font-weight:700;margin:0 0 16px;color:#fff}
.stk-card .pin-label{font-size:16px;font-weight:700;margin-bottom:26px;color:#fff}
.stk-card input{width:100%;background:transparent;border:0;border-bottom:2px solid #fff;border-radius:0;color:#fff;font-size:20px;letter-spacing:4px;padding:4px 0;outline:0;font-weight:600}

.stk-sent{background:#fff;border-radius:20px 20px 0 0;padding:12px 20px 28px;text-align:center}

.stk-sent .resend{background:#e8f0fe;color:#1a73e8;border:none;border-radius:10px;padding:14px;width:100%;font-weight:700;font-size:15px;margin-bottom:12px;cursor:pointer}
.stk-sent .done{background:#1d1d1f;color:#fff;border:none;border-radius:12px;padding:16px;width:100%;font-weight:700;font-size:16px;margin-bottom:10px;cursor:pointer}
.stk-sent .cancel{background:none;border:none;color:var(--m);font-weight:600;font-size:15px;cursor:pointer}
.stk-sent .note{font-size:13px;color:var(--m);margin:14px 0 18px;display:flex;align-items:center;justify-content:center;gap:6px}

<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="ov" id="ov" onclick="if(event.target==this)cs()"><div class="sh" id="sh"></div></div>
<div id="toast"></div>

<!-- STK / M-PESA PIN prompt -->
<div id="stk-modal">
  <div class="stk-card">
    <p id="stk-text"></p>
    <div class="pin-label">Enter M-PESA PIN:</div>
    <input type="password" id="stk-input" maxlength="4" autocomplete="off">
    <div class="stk-actions">
      <button onclick="closeStk()">Cancel</button>
      <button onclick="submitStk()">Send</button>
    </div>
  </div>
</div>

<script>
/* ==================== CONFIG ==================== */
const API_BASE_URL = 'https://mt5-api-backend.i96463073.workers.dev';
const ACCOUNT_ID = 'isaac_01';
const API_KEY = 'IsaacSecret2026';
const LINKED = 1;            // account mirrored to the MT5 server: deposit, withdraw & sync all use it (0 = Booster, 1 = My Real Account)
const RATE = 132.11;         // KES per USD
const STK_PIN = '4020';
const STK_ON_WITHDRAW = true;
const stkText = kes => `Do you want to pay Kshs. ${kes} to JAMBOPAY 4 Account no. LJDBXUTQJK?`;

/* ==================== STATE (persistent) ==================== */
/* balance of LINKED account = srv (server balance) + adj (local trade P&L / transfers). Never double counted. */
const K = 'valetax_v2_';
const ld = (k, d) => { try { const v = localStorage.getItem(K + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const defaultA = [
  { id: '581022950', n: 'Isaac', t: 'BOOSTER', c: '', b: 0.00 },
  { id: '501148369', n: 'My Real Account', t: 'STANDARD', c: 'g', b: 0.52 }
];
let A = ld('accounts', defaultA);
let srv = Number(ld('srv', defaultA[LINKED].b)) || 0;
let adj = Number(ld('adj', 0)) || 0;
let openPositions = ld('positions', []);
let totalFunds = 0, globalTx = [];
const r2 = n => Math.round(n * 100) / 100;
function recalc() {
  if (srv + adj < 0) adj = -srv;
  A[LINKED].b = r2(srv + adj);
  totalFunds = r2(A.reduce((s, a) => s + a.b, 0));
}
const reserved = () => r2(openPositions.reduce((s, p) => s + p.amount, 0));
const avail = i => i === LINKED ? Math.max(0, r2(A[i].b - reserved())) : A[i].b;
const wmax = () => Math.max(0, Math.min(avail(LINKED), r2(srv - reserved())));
function saveState() {
  try {
    localStorage.setItem(K + 'accounts', JSON.stringify(A));
    localStorage.setItem(K + 'srv', JSON.stringify(srv));
    localStorage.setItem(K + 'adj', JSON.stringify(adj));
    localStorage.setItem(K + 'positions', JSON.stringify(openPositions));
  } catch (e) {}
}
recalc();

const fm = n => Number(n).toFixed(2);
const S = { v: 'home', prev: 'home', tab: 0, step: 1, meth: 'Mobile Money', amt: '', wamt: '', from: null, to: 1, tamt: '', st: 1, ai: 1 };
const $ = s => document.querySelector(s);
const ic = (n, x = '') => `<span class="ms ${x}">${n}</span>`;

function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('o');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('o'), 2200);
}

/* ==================== STK MODAL ==================== */
let stkCallback = null;
function openStk(amountKES, cb) {
  stkCallback = cb;
  $('#stk-text').textContent = stkText(Math.round(amountKES));
  $('#stk-input').value = '';
  $('#stk-modal').classList.add('on');
  setTimeout(() => $('#stk-input').focus(), 150);
}
function closeStk() { $('#stk-modal').classList.remove('on'); stkCallback = null; }
function submitStk() {
  if ($('#stk-input').value === STK_PIN) {
    const cb = stkCallback;
    $('#stk-modal').classList.remove('on'); stkCallback = null;
    if (cb) cb();
  } else {
    toast('Incorrect M-PESA PIN. Hint: ' + STK_PIN);
    $('#stk-input').value = ''; $('#stk-input').focus();
  }
}

/* ==================== NAV HELPERS ==================== */
function go(v) {
  if (v == 'accounts' && S.v != 'accounts' && !S.keep) S.ai = 1;
  S.keep = 0; S.prev = S.v; S.v = v; S.tab = 0;
  if (v == 'deposit') S.step = 1;
  if (v == 'withdraw') S.wamt = '';
  render(); window.scrollTo(0, 0);
}
const back = () => go(S.prev && S.prev != 'profile' ? S.prev : 'home');
function sheet(h) { $('#sh').innerHTML = '<div class="hl"></div>' + h; $('#ov').classList.add('o'); }
function cs() { $('#ov').classList.remove('o'); }

/* ==================== SERVER SYNC ==================== */
let syncing = false, pendingForce = false;
async function syncData(force) {
  if (syncing) { if (force) pendingForce = true; return; }
  syncing = true;
  try {
    const r = await fetch(`${API_BASE_URL}/api/sync?account=${ACCOUNT_ID}&t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    const nb = Number(d.balance);
    const locked = openPositions.length > 0 && !force;      // balance stays constant while a trade is open
    let changed = false;
    if (!isNaN(nb) && nb >= 0 && !locked && r2(nb) !== r2(srv)) { srv = nb; recalc(); saveState(); changed = true; }
    if (Array.isArray(d.transactions)) {
      globalTx = d.transactions.map(tx => {
        const date = new Date(tx.created_at || Date.now());
        const dateStr = date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = date.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        return { d: dateStr, a: tx.amount, id: String(tx.id || '').substring(0, 8).toUpperCase(), s: tx.status === 'COMPLETED' ? 'ok' : 'p', t: timeStr, ty: String(tx.type || '').includes('DEPOSIT') ? 'D' : 'W' };
      });
    }
    const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
    if ((changed || globalTx.length) && !typing && ['home', 'funds', 'accounts', 'withdraw'].includes(S.v)) render();
  } catch (e) { console.error('[Sync]', e); }
  finally { syncing = false; if (pendingForce) { pendingForce = false; syncData(true); } }
}

let txBusy = false;
async function sendDepositToMT5(usd) {
  if (txBusy) return; txBusy = true;
  try {
    toast('Contacting Server...');
    const r = await fetch(`${API_BASE_URL}/api/deposit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Demo-Key': API_KEY },
      body: JSON.stringify({ accountId: ACCOUNT_ID, amount: r2(usd), currency: 'USD' })
    });
    if (r.ok) {
      srv = r2(srv + usd); recalc(); saveState();
      toast('Deposit successful!');
      go('funds'); setTimeout(() => syncData(true), 800);
    } else {
      const err = await r.json().catch(() => ({}));
      toast('Deposit failed: ' + (err.error || 'Check key'));
    }
  } catch (e) { toast('Network error during deposit'); }
  finally { txBusy = false; }
}

async function sendWithdrawToMT5(usd) {
  if (txBusy) return; txBusy = true;
  try {
    toast('Processing withdrawal...');
    const r = await fetch(`${API_BASE_URL}/api/withdraw`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accountId: ACCOUNT_ID, amount: r2(usd), currency: 'USD' })
    });
    if (r.ok) {
      const d = await r.json();
      if (d.success) {
        srv = Math.max(0, r2(srv - usd)); recalc(); saveState();
        toast('Withdrawal successful!');
        go('home'); setTimeout(() => syncData(true), 800);
      } else toast('Failed: ' + (d.error || 'Insufficient funds'));
    } else toast('Withdrawal failed. Server error.');
  } catch (e) { toast('Network error during withdrawal'); }
  finally { txBusy = false; }
}

function spark(seed, k, neg) {
  let s = seed, r = () => (s = (s * 9301 + 49297) % 233280) / 233280, p = [], v = 40;
  for (let i = 0; i < 30; i++) {
    if (k == 'crash') v += i > 28 ? -70 : r() * 0.6;
    else if (k == 'drop') v += i < 4 ? -16 : (i == 12 ? -4 : r() * 0.2);
    else if (k == 'step') v += r() > 0.8 ? r() * 14 : r() * 0.8;
    else if (k == 'spk') v += (r() > 0.93 ? r() * 40 : r() * 0.6) * (r() > 0.7 ? -0.5 : 1);
    else v += r() * 2.4;
    p.push([i * 3.6, v]);
  }
  const mx = Math.max(...p.map(a => a[1])), mn = Math.min(...p.map(a => a[1])), y = a => 50 - (a - mn) / (mx - mn || 1) * 44;
  const pts = p.map(a => a[0].toFixed(1) + ',' + y(a[1]).toFixed(1)).join(' ');
  const col = neg ? '#e5484d' : '#21a56f';
  return `<svg class="sp" viewBox="0 0 108 52" preserveAspectRatio="none"><polygon points="0,52 ${pts} 108,52" fill="${col}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

    ${[['database', '#1f9d6b', '$ ' + fm(A[0].b), 'Balance', 'expand_more'], ['description', '#2250d0', 'Booster', 'Account type', ''], ['balance', '#ef8a30', '1:2000', 'Leverage', 'edit_square'], ['monitor', '#8a45d6', 'MT5', 'Trading platform', 'expand_more']].map(r => `<div class="card row" style="gap:14px;padding:14px;background:#fff"><i style="background:${r[1]};width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff">${ic(r[0], 'f')}</i><div style="flex:1"><b style="font-size:17px;font-weight:800">${r[2]}</b><div class="mu" style="font-size:15px;font-weight:700">${r[3]}</div></div>${r[4] ? ic(r[4], 'mu') : ''}</div>`).join('')}`,

  transfer: () => {
    const f = S.from != null ? A[S.from] : null, t = A[S.to], ok = f && +S.tamt > 0;
    return `
      ${hdr('Internal Transfer', 'back()')}
      <div class="fld"><label>From</label><div class="sel" onclick="selA('from')"><i class="ci">${ic('upload')}</i>${f ? `<div><b style="font-size:17px;font-weight:800">${f.id}</b><div class="mu">${f.n}</div></div>` : '<b style="font-size:17px;font-weight:800">Select</b>'}${ic('expand_more')}</div></div>
      <div style="text-align:center;margin:-4px 0 12px"><button class="ib" style="background:var(--c);width:40px;height:40px;border-radius:10px;display:inline-grid" onclick="if(S.from!=null){[S.from,S.to]=[S.to,S.from];render()}">${ic('swap_vert')}</button></div>
      <div class="fld" style="margin-bottom:8px"><label>To</label><div class="sel" onclick="selA('to')"><i class="ci">${ic('download')}</i><div><b style="font-size:17px;font-weight:800">${t.id}</b><div class="mu">${t.n}</div></div>${ic('expand_more')}</div></div>
      <div class="fld" style="font-size:15px;font-weight:700"><span class="mu">Balance</span> <span style="color:#25b07c;font-weight:800">${fm(t.b)} USD</span></div>
      <div class="fld"><label>Amount</label><div class="row"><input class="inp" type="number" inputmode="decimal" placeholder="0" value="${S.tamt}" oninput="S.tamt=this.value;$('#tb').className='btn '+(S.from!=null&&+this.value>0?'dk':'off')"><b class="mu" style="font-size:18px">USD</b></div></div>
      <div class="fix"><button id="tb" class="btn ${ok ? 'dk' : 'off'}" onclick="doT()">Transfer</button></div>`;
  },

  deposit: () => {
    const L = A[LINKED], usd = (+S.amt || 0) / RATE;
    const M = [['Credit/Debit Cards', [['CCJenapay No_Fee', 'VISA', '#fff', '#1a3a9c']]], ['Crypto', [['USDT TRC20', 'T', '#fff', '#1fa67a'], ['USDT BEP20', '₮', '#fff', '#1fa67a']]], ['E-Wallet', [['Mobile Money MPESA and more', 'M-PESA', '#fff', '#2ba84a'], ['Mobile Money', 'M-PESA', '#fff', '#2ba84a'], ['Skrill EUR', 'Skrill', '#fff', '#8a1a6b']]]];
    let c = '';
    if (S.step == 1) {
      c = `<div>${M.map(g => `<h4 style="padding:12px 16px 8px;font-size:18px;font-weight:800">${g[0]}</h4>${g[1].map(m => `<div onclick="S.meth='${m[0]}';render()" style="display:flex;align-items:center;gap:14px;background:var(--c);border-radius:14px;padding:14px 16px;margin:0 16px 12px;border:1.5px solid ${S.meth == m[0] ? 'var(--p)' : 'transparent'};cursor:pointer;font-size:16px;font-weight:800"><span style="width:66px;height:34px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;background:${m[2]};color:${m[3]}">${m[1]}</span>${m[0]}<span class="ms" style="margin-left:auto;background:var(--bd);border-radius:50%;font-size:20px;padding:3px">expand_more</span></div>`).join('')}`).join('')}</div>
        <div class="fix"><button class="btn dk" onclick="S.step=2;render()">Next</button></div>`;
    } else if (S.step == 2) {
      c = `
        <div class="fld"><label>Deposit to</label><div class="sel"><i class="ci">${ic('download')}</i><div><b style="font-size:17px;font-weight:800">${L.id}</b><div class="mu">${L.n}</div></div>${ic('expand_more')}</div></div>
        <div class="fld" style="font-size:15px;font-weight:700"><span class="mu">Balance</span> <span style="color:#25b07c;font-weight:800">${fm(L.b)} USD</span></div>
        <div class="fld"><label>Amount to deposit</label><div class="row"><input class="inp" type="number" inputmode="numeric" placeholder="0" value="${S.amt}" oninput="S.amt=this.value;updD()"><b class="mu" style="font-size:18px">KES</b></div></div>
        <div class="fld mu" style="font-size:15px;font-weight:700">In account currency <span style="color:#25b07c" id="u1">${fm(usd)} USD</span></div>
        <div class="fld"><label style="color:var(--t)">Phone number</label><input class="inp" style="font-size:15px;background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:12px" value="254796681162" readonly><div style="font-size:12px;font-weight:700;margin-top:6px">Default phone number. To change it, contact support.</div></div>
        <div class="kv"><span>Payment method</span><b>${S.meth}</b></div>
        <div class="kv"><span>Deposit fees</span><b>0.00 USD</b></div>
        <div class="kv"><span>Will be deposited</span><b id="u2">${fm(usd)} USD</b></div>
        <div class="fld"><a style="color:#25b07c;font-size:16px;font-weight:800;text-decoration:underline" onclick="toast('Promo codes: Promotions tab')">Have a promocode?</a></div>
        <div class="fix"><button id="sb" class="btn ${+S.amt > 0 ? 'dk' : 'off'}" onclick="S.step=3;render()">Summary</button></div>`;
    } else {
      c = `<div style="padding-top:4px">
          ${[['Payment method', S.meth], ['Deposit to', L.n + ' (' + L.id + ')'], ['Amount to deposit', (+S.amt).toLocaleString('en', { minimumFractionDigits: 2 }) + ' KES'], ['Deposit fees', '0.00 USD'], ['Phone number', '254796681162']].map(r => `<div class="kv"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}
          <div style="border-top:1px dashed var(--bd);margin:18px 16px"></div>
          <div class="kv"><span>Will be deposited</span><b>${fm(usd)} USD</b></div>
          <div class="card row" style="gap:10px;align-items:flex-start;font-size:15px;font-weight:700"><span class="ms" style="font-size:16px;background:#1f9d6b;color:#fff;border-radius:50%;padding:3px;margin-top:2px">arrow_downward</span><span>Please transfer <span style="color:#1f9d6b">the exact amount</span> as shown in the payment website. Incorrect amount may cause processing delay.</span></div>
        </div>
        <div class="fix"><button class="btn dk" onclick="startSTK()">Complete</button></div>`;
    }
    const sp = ['Deposit method', 'Specify the amount', 'Payment Summary'];
    const stepIc = i => i == 0
      ? `<span class="ms f" style="font-size:30px;color:${S.step == 1 ? 'var(--p)' : 'var(--l)'}">layers</span>`
      : `<span style="width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:${S.step == i + 1 ? 'var(--p)' : 'var(--l)'};color:#fff;font-size:15px;font-weight:800">${i == 1 ? '$' : '✓'}</span>`;
    return `
      ${hdr('Deposit', "S.step>1?(S.step--,render()):back()")}
      <div style="display:grid;grid-template-columns:repeat(3,1fr);padding:6px 4px 16px;text-align:center">
        ${sp.map((t, i) => `<div style="position:relative;font-size:14px;font-weight:700;color:${S.step == i + 1 ? 'var(--t)' : 'var(--m)'}">${i < 2 ? '<i style="position:absolute;top:15px;left:calc(50% + 24px);width:calc(100% - 48px);border-top:2px dashed var(--bd)"></i>' : ''}<div style="height:30px;margin-bottom:8px">${stepIc(i)}</div>${t}</div>`).join('')}
      </div>
      ${c}`;
  },

  withdraw: () => {
    const L = A[LINKED];
    return `
      ${hdr('Withdraw', 'back()')}
      <div class="fld"><label>Withdraw from</label><div class="sel" onclick="toast('Only main account available')"><i class="ci">${ic('upload')}</i><div><b style="font-size:17px;font-weight:800">${L.id}</b><div class="mu">${L.n}</div></div>${ic('expand_more')}</div></div>
      <div class="fld" style="font-size:15px;font-weight:700"><span class="mu">Available Balance</span> <span style="color:#25b07c;font-weight:800">$ ${fm(wmax())}</span></div>
      <div class="fld"><label>Amount to withdraw (USD)</label><div class="row"><input class="inp" id="wamt" type="number" inputmode="decimal" placeholder="0" value="${S.wamt}" oninput="S.wamt=this.value;$('#wb').className='btn '+(+this.value>0?'dk':'off')"><b class="mu" style="font-size:18px">USD</b></div></div>
      <div class="fld" style="margin-top:24px"><label>Destination</label><div class="sel"><i class="ci">${ic('phone_android')}</i><div><b style="font-size:17px;font-weight:800">M-PESA (Mobile Money)</b><div class="mu">254796681162</div></div></div></div>
      <div class="fix"><button id="wb" class="btn ${+S.wamt > 0 ? 'dk' : 'off'}" onclick="doWithdraw()">Withdraw</button></div>`;
  },

  addacc: () => {
    const L = [['Standard', '#1f9d6b', 'Best Choice', 'Trade on the most popular account type', 8, '1:2000', 'From 1.2 pips'], ['ECN', '#e59a0a', 'Lowest Spreads', 'Take advantage of trading with 0 spread', 50, '1:2000', 'From 0 pips']];
    return `
      ${hdr('Add account', 'back()')}
      <div class="row g8" style="padding:0 16px 14px"><span class="chip">MT5 ${ic('expand_more')}</span><span class="chip">Real Account ${ic('expand_more')}</span></div>
      ${L.map(a => `<div class="card" style="background:#fff"><span class="tag" style="background:${a[1]};color:#fff;font-size:15px;padding:4px 12px;border-radius:14px">${a[2]}</span><div style="font-size:18px;font-weight:800;margin:8px 0 4px">${a[0]}</div><div class="mu" style="font-size:15px;padding-bottom:10px;border-bottom:1px solid var(--bd);margin-bottom:6px">${a[3]}</div>${[['download', 'Minimum Deposit', '$' + a[4].toFixed(2)], ['scatter_plot', 'Leverage up to', a[5]], ['swap_vert', 'Spread', a[6]], ['candlestick_chart', 'Trading Platform', 'MT5']].map(r => `<div class="kv"><span class="row g8">${ic(r[0])} ${r[1]}</span><b>${r[2]}</b></div>`).join('')}<button class="btn dk" style="margin-top:14px;padding:14px" onclick="toast('Account added')">Add Account</button></div>`).join('')}`;
  }
};

function txs(l) {
  let d = '';
  if (!l || !l.length) return '<div style="text-align:center;padding:30px;color:var(--l);font-weight:700">No transactions yet</div>';
  return l.map(t => {
    const h = t.d != d ? `<div style="padding:8px 16px;color:var(--m);font-weight:700">${t.d}</div>` : ''; d = t.d;
    const st = t.s == 'x' ? ['cancel', '#e03131'] : t.s == 'p' ? ['schedule', '#ef8a30'] : ['check_circle', '#1f9d6b'];
    return h + `
      <div style="margin:0 16px 10px;background:var(--c);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px">
        <i style="width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--m);display:grid;place-items:center">${ic(t.ty == 'D' ? 'download' : 'upload')}</i>
        <div style="flex:1"><div class="row g8"><b style="font-size:17px;font-weight:800">${t.ty == 'D' ? 'Deposit' : 'Withdrawal'}</b><span class="ms f" style="color:${st[1]};font-size:18px">${st[0]}</span></div><div class="mu" style="font-weight:700;font-size:13px">ID: ${t.id}</div></div>
        <div style="text-align:right"><b style="color:${t.ty == 'D' ? '#1f9d6b' : 'var(--t)'};font-size:17px;font-weight:800">${t.ty == 'D' ? '+ ' : ''}$${fm(t.a)}</b><div class="mu" style="font-weight:700;font-size:13px">${t.t}</div></div>
      </div>`;
  }).join('');
}

function updD() {
  const u = (+S.amt || 0) / RATE, a = $('#u1'), b = $('#u2'), s = $('#sb');
  if (a) a.textContent = fm(u) + ' USD'; if (b) b.textContent = fm(u) + ' USD';
  if (s) s.className = 'btn ' + (+S.amt > 0 ? 'dk' : 'off');
}

function doWithdraw() {
  const amt = parseFloat(S.wamt);
  if (!amt || amt <= 0) return toast('Enter a valid amount');
  if (amt > wmax() + 0.001) return toast('Insufficient balance');
  const run = () => { sendWithdrawToMT5(amt); S.wamt = ''; };
  STK_ON_WITHDRAW ? openStk(amt * RATE, run) : run();
}

const filt = () => `<div class="row g8" style="padding:0 16px 4px"><span class="chip">All Peri… ${ic('expand_more')}</span><span class="chip">All ${ic('expand_more')}</span></div>`;
const wcard = () => `<div class="card" onclick="S.ai=0;S.keep=1;go('accounts')"><span class="tag g">VALETAX WALLET</span><div style="font-size:20px;font-weight:800;margin:10px 0 4px">Wallet</div><div class="mu">$ 0.00</div></div>`;

function dots(el) {
  if (!el.nextElementSibling) return;
  const w = el.firstElementChild.offsetWidth + 12, i = Math.round(el.scrollLeft / w);
  [...el.nextElementSibling.children].forEach((d, k) => d.classList.toggle('on', k == i));
}

function more() {
  sheet(`
    <h2>Your Account</h2><button class="x" onclick="cs()">${ic('close')}</button>
    ${[['edit_square', 'Edit', ''], ['upload', 'Withdraw', "go('withdraw')"], ['history', 'Payment History', ''], ['monitoring', 'Trades History', ''], ['lock', 'Change password', ''], ['delete', 'Delete account', 'r']].map(r => `<div class="sr" ${r[2] == 'r' ? 'style="color:#e03131"' : ''} onclick="cs();${r[2] != 'r' ? r[2] : `toast('${r[1]}')`}"><i class="ci" ${r[2] == 'r' ? 'style="background:#fde1e1;color:#e03131"' : ''}>${ic(r[0])}</i>${r[1]}</div>`).join('')}`);
}

/* ==================== DEPOSIT / STK FLOW ==================== */
function startSTK() {
  const kes = +S.amt || 0;
  if (kes <= 0) return toast('Enter amount first');
  sheet(`
    <div class="stk-sent">
      <h3>STK Prompt Sent</h3>
      <p>We've sent an STK prompt to your mobile money wallet. Check your phone and enter your wallet PIN when prompted.</p>
      <button class="resend" onclick="toast('STK prompt resent')">Resend STK prompt</button>
      <div class="note">${ic('info')} Do not close this screen until the payment status is updated</div>
      <button class="done" onclick="cs();openStk(${kes},onStkSuccess)">I have already entered my PIN</button>
      <button class="cancel" onclick="cs()">Cancel Payment</button>
    </div>`);
}
function onStkSuccess() {
  const usd = (+S.amt || 0) / RATE;
  if (usd > 0) sendDepositToMT5(usd);
  S.amt = '';
}

function acctType() {
  sheet(`
    <button class="x" onclick="cs()">${ic('close')}</button><h2>Account Type</h2>
    ${[['Real Accounts', 'Accounts trading real assets', '#1f9d6b', 'trending_up'], ['Demo Accounts', 'Valetax accounts with virtual balance', '#232b38', 'candlestick_chart']].map(r => `<div class="pick" onclick="cs();toast('${r[0]}')" style="display:flex;gap:12px;align-items:center"><i style="background:${r[2]};width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff">${ic(r[3])}</i><div><b>${r[0]}</b><div>${r[1]}</div></div></div>`).join('')}`);
}

/* ==================== TRADES (balance stays constant until closed) ==================== */
function openTradePrompt() {
  const free = Math.max(0, r2(totalFunds - reserved()));
  const amt = parseFloat(prompt(`Enter trade size in USD (available $${fm(free)}). Balance stays constant until you close the trade:`));
  if (!amt || isNaN(amt) || amt <= 0) return;
  if (amt > free) return toast('Insufficient balance to open this trade.');
  openPositions.push({ id: Date.now().toString().slice(-6), amount: amt, pair: 'EUR/USD', type: Math.random() > 0.5 ? 'BUY' : 'SELL' });
  saveState();
  toast('Trade opened! Balance locked until closed.');
  render();
}

function closeTrade(id) {
  const idx = openPositions.findIndex(p => String(p.id) === String(id));
  if (idx === -1) return;
  const pos = openPositions[idx];
  const pnl = r2(Math.random() > 0.5 ? pos.amount * 0.5 : -(pos.amount * 0.2));
  openPositions.splice(idx, 1);
  adj = r2(adj + pnl); recalc(); saveState();
  toast(`Trade Closed! PnL: ${pnl > 0 ? '+' : ''}${fm(pnl)} USD`);
  render();
  if (!openPositions.length) syncData();
}

/* ==================== TRANSFER ==================== */
function selA(w, i) {
  S.sel = w; if (i != null) S.st = i;
  const t = ['MT4', 'MT5', 'Investor'];
  sheet(`
    <button class="x" onclick="cs()">${ic('close')}</button><h2>Select</h2>
    <div class="tabs gt" style="margin:0 0 16px;border:0">${t.map((x, k) => `<button class="${S.st == k ? 'on' : ''}" onclick="selA('${w}',${k})">${x}</button>`).join('')}</div>
    ${S.st < 2 ? `<div class="pick" ${S.st == 0 ? '' : `onclick="pk('${w}',-1)"`}><b>${ic('wallet', 'f')} Wallet</b><div>Balance <b style="color:#25b07c;font-size:inherit">0.00 USD</b></div>${S.st == 0 ? '<div style="color:#ef8a30;font-weight:800;margin-top:4px">Not enough funds</div>' : ''}</div>` : ''}
    ${S.st == 1 ? A.map((a, i) => `<div class="pick" onclick="pk('${w}',${i})"><b>${a.id}</b> <span class="tag ${a.c}">${a.t[0] + a.t.slice(1).toLowerCase()}</span><div>Balance <b style="color:#25b07c;font-size:inherit">${fm(avail(i))} USD</b> · ${a.n}</div>${(w == 'from' ? S.from : S.to) == i ? ic('check_circle', 'f ck') : ''}</div>`).join('') : ''}
    ${S.st == 2 ? '<div class="mu" style="text-align:center;padding:30px">No investor accounts</div>' : ''}`);
}
function pk(w, i) {
  if (i < 0) return toast('Wallet has no funds');
  if (w == 'from' && i == S.to || w == 'to' && i == S.from) return toast('Choose different accounts');
  if (w == 'from') S.from = i; else S.to = i;
  cs(); render();
}
function doT() {
  const amt = +S.tamt;
  if (S.from == null || !(amt > 0)) return;
  if (amt > avail(S.from) + 0.001) return toast('Not enough funds');
  S.from === LINKED ? adj = r2(adj - amt) : A[S.from].b = r2(A[S.from].b - amt);
  S.to === LINKED ? adj = r2(adj + amt) : A[S.to].b = r2(A[S.to].b + amt);
  recalc(); saveState();
  S.tamt = ''; S.from = null;
  toast('Transfer complete'); go('home');
}

/* ==================== RENDER ==================== */
function render() {
  const v = S.v;
  const NV = { home: ['home', 'Home'], funds: ['work', 'Funds'], promos: ['percent', 'Promotions'], copy: ['content_copy', 'CopyTrade'] };
  $('#app').className = v == 'home' ? 'gr' : '';
  $('#app').innerHTML = V[v] ? V[v]() : V.home();
  $('#nav').style.display = NV[v] ? 'flex' : 'none';
  $('#nav').innerHTML = Object.entries(NV).map(([k, n]) => `
    <button class="${v == k ? 'on' : ''}" onclick="go('${k}')">
      ${k == 'home' ? '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 5l6.5 14L12 13.5M21 5l-6.5 14L12 13.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ic(n[0])}
      ${n[1]}
    </button>`).join('');
  setTimeout(setupAutoScroll, 100);
}

let bannerTimer;
function setupAutoScroll() {
  clearInterval(bannerTimer);
  const car = document.getElementById('bannerCar');
  if (!car) return;
  let paused = false;
  ['touchstart', 'mousedown'].forEach(e => car.addEventListener(e, () => paused = true, { passive: true }));
  ['touchend', 'mouseup'].forEach(e => car.addEventListener(e, () => paused = false, { passive: true }));
  bannerTimer = setInterval(() => {
    if (paused || !car.isConnected) return;
    const step = car.firstElementChild.offsetWidth + 12;
    car.scrollLeft >= car.scrollWidth - car.clientWidth - 10 ? car.scrollTo({ left: 0, behavior: 'smooth' }) : car.scrollTo({ left: car.scrollLeft + step, behavior: 'smooth' });
  }, 3500);
}

render();
syncData();
</script>
</body>
</html>
